# This workflow owns the reproducible CPU and frontend checks required for every
# change to main. It intentionally excludes GPU validation and deployment.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-cpu:
    name: Rust CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint CPU workspace
        run: cargo clippy --workspace --all-targets --locked --no-default-features --features cpu -- -D warnings
      - name: Test CPU workspace
        run: cargo test --workspace --all-targets --locked --no-default-features --features cpu

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Check frontend
        run: npm run check
      - name: Build frontend
        run: npm run build
