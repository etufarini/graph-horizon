# This manifest owns the Rust workspace metadata, the root application package,
# backend feature forwarding, build profiles, and direct dependencies.

[workspace]
members = [".", "crates/graph_horizon_engine"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/etufarini/graph-horizon"
homepage = "https://github.com/etufarini/graph-horizon"

[package]
name = "graph-horizon"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local text-to-text runtime with terminal and integrated web interfaces."
readme = "README.md"
publish = false

[features]
# Forward exactly one explicit backend profile to graph_horizon_engine. There is no
# default or target-based selection.
cpu = ["graph_horizon_engine/cpu"]
vulkan = ["graph_horizon_engine/vulkan"]
vulkan-hybrid = ["graph_horizon_engine/vulkan-hybrid"]
metal = ["graph_horizon_engine/metal"]
metal-hybrid = ["graph_horizon_engine/metal-hybrid"]

# Maximum-performance build profile, used by `support/install.sh --profile fast`.
# Inherits `release` and adds fat LTO + a single codegen unit so the compiler can
# optimize across crate boundaries and expose more vectorization opportunities. Slower to compile;
# meant for optimized runs, not day-to-day dev.
[profile.fast]
inherits = "release"
lto = true
codegen-units = 1

[dependencies]
graph_horizon_engine = { path = "crates/graph_horizon_engine", default-features = false }
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
tokio = { version = "1.52.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false }
# The Web UI owns a small internal HTTP listener. `hyper` needs the server+http1
# features and `hyper-util` the Tokio runtime adapter for its accept loop.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
scraper = { version = "0.27.0", default-features = false }
url = "2.5.8"
roxmltree = "0.20.0"
httpdate = "1.0.3"
