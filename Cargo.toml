[workspace]
members = [".", "crates/graph_horizon_engine"]
resolver = "3"

[package]
name = "graph-horizon"
version = "0.1.0"
edition = "2024"

[features]
# Forward exactly one explicit backend profile to graph_horizon_engine. There is no
# default or target-based selection.
cpu = ["graph_horizon_engine/cpu"]
vulkan = ["graph_horizon_engine/vulkan"]
vulkan-hybrid = ["graph_horizon_engine/vulkan-hybrid"]
metal = ["graph_horizon_engine/metal"]
metal-hybrid = ["graph_horizon_engine/metal-hybrid"]

# Maximum-performance build profile, used by `support/install.sh --profile fast`.
# Inherits `release` and adds fat LTO + a single codegen unit so the compiler can
# fully inline and auto-vectorize the scalar CPU kernels. Slower to compile;
# meant for optimized runs, not day-to-day dev.
[profile.fast]
inherits = "release"
lto = true
codegen-units = 1

[dependencies]
graph_horizon_engine = { path = "crates/graph_horizon_engine", default-features = false }
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
tokio = { version = "1.52.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false }
# Server mode (`--mode server`). Already present in Cargo.lock as
# transitive deps of reqwest, so they add no new crate to compile; declared here
# only to use them directly. `hyper` needs the server+http1 features and
# `hyper-util` the tokio runtime adapter (TokioIo) for the accept loop.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
