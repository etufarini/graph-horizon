[package]
name = "graph_horizon_engine"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-machete]
# cargo-machete does not inspect build.rs, where this dependency is consumed.
ignored = ["shaderc"]

[features]
# Independent public profiles; backend/mod.rs enforces that exactly one is
# selected. Hybrid profiles gate their concrete dependencies directly.
cpu = []
vulkan = ["dep:ash", "dep:shaderc"]
vulkan-profile = ["vulkan"]
vulkan-hybrid = ["dep:ash", "dep:shaderc"]
metal = [
    "dep:dispatch2",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-metal",
]
metal-hybrid = [
    "dep:dispatch2",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-metal",
]

[dependencies]
# Optional GPU bindings, gated by the matching feature.
ash = { version = "0.38", optional = true }
color-eyre = "0.6.5"
memmap2 = "0.9"
dispatch2 = { version = "=0.3.1", optional = true }
objc2 = { version = "=0.6.2", optional = true }
objc2-foundation = { version = "=0.3.2", optional = true }
objc2-metal = { version = "=0.3.2", optional = true }

# build-time only: compiles the GLSL .comp compute shaders to SPIR-V via
# libshaderc (bundled). Not a runtime dependency; only used by the `vulkan`
# profiles (the `cpu` build must not require it).
#
# `build-from-source` is REQUIRED, not an optimization: without it shaderc-sys
# prefers a system libshaderc when one is present, and on Debian/Ubuntu the
# packaged `libshaderc_combined.a` is not self-contained (glslang ships as a
# separate `libglslang.a` that shaderc-sys never links), so the build script
# fails to link with undefined `glslang::TShader::*` symbols. Forcing the
# bundled source build makes linking deterministic on every host; the cmake
# overrides this build needs live in `.cargo/config.toml`.
[build-dependencies]
# 0.9+ bundles a glslang new enough for GL_EXT_shader_integer_dot_product (dp4a),
# used by the int8 Q4_K GEMV. Version bump of an existing build-dep, not a new dep.
shaderc = { version = "0.9", optional = true, features = ["build-from-source"] }
