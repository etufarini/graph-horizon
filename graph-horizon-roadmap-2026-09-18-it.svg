<?xml version="1.0" encoding="UTF-8"?>
<!--
  Questa tavola tecnica autonoma riassume i rischi di prontezza pubblica di Graph Horizon,
  i progressi verificati, i gate operativi, la decisione di release e la pubblicazione del 18 settembre 2026.
  Usa solo elementi SVG nativi e righe di testo fisse per un layout stabile e portabile.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2500" viewBox="0 0 1800 2500"
     role="img" aria-labelledby="title description">
  <title id="title">Graph Horizon — piano tecnico di lancio — 18 settembre 2026</title>
  <desc id="description">Registro rischi, progressi verificati al 26 agosto, deliverable tecnici, gate di release e pubblicazione Discord più X di Graph Horizon.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101c"/>
      <stop offset="0.58" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1930"/>
    </linearGradient>
    <linearGradient id="deadline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <style>
      .sans { font-family: Inter, "Noto Sans", ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Noto Sans Mono", ui-monospace, monospace; }
      .eyebrow { font-size: 19px; font-weight: 760; letter-spacing: 3px; fill: #67e8f9; }
      .main-title { font-size: 67px; font-weight: 800; letter-spacing: -2px; fill: #f8fafc; }
      .subtitle { font-size: 25px; font-weight: 450; fill: #9fb0ca; }
      .section-title { font-size: 35px; font-weight: 760; fill: #f8fafc; }
      .section-note { font-size: 18px; font-weight: 450; fill: #8ea2c1; }
      .risk-id { font-size: 17px; font-weight: 760; letter-spacing: 1.5px; fill: #67e8f9; }
      .risk-title { font-size: 22px; font-weight: 740; fill: #f8fafc; }
      .risk-body { font-size: 18px; font-weight: 430; fill: #cbd5e1; }
      .risk-action { font-size: 17px; font-weight: 620; fill: #a5f3fc; }
      .priority { font-size: 15px; font-weight: 800; letter-spacing: 1px; text-anchor: middle; fill: #fee2e2; }
      .table-head { font-size: 16px; font-weight: 780; letter-spacing: 1.8px; fill: #8ea2c1; }
      .date { font-size: 21px; font-weight: 760; fill: #f8fafc; }
      .date-sub { font-size: 16px; font-weight: 650; fill: #67e8f9; }
      .task { font-size: 18px; font-weight: 450; fill: #d8e1ee; }
      .gate { font-size: 17px; font-weight: 570; fill: #b8c7dc; }
      .gate-label { font-size: 15px; font-weight: 780; letter-spacing: 1px; fill: #a5f3fc; }
      .done { text-decoration: line-through; text-decoration-color: #67e8f9; text-decoration-thickness: 2px; opacity: 0.62; }
    </style>
  </defs>

  <rect width="1800" height="2500" fill="url(#background)"/>
  <circle cx="1650" cy="80" r="330" fill="#2563eb" opacity="0.08"/>
  <circle cx="40" cy="2350" r="410" fill="#7c3aed" opacity="0.07"/>
  <path d="M90 38 H1710" stroke="#22d3ee" stroke-width="4" opacity="0.75"/>

  <!-- Header: fixed scope and delivery date. -->
  <g class="sans">
    <text x="90" y="105" class="eyebrow">GRAPH HORIZON / QUADRO DI PRONTEZZA PUBBLICA</text>
    <text x="90" y="186" class="main-title">Piano di consolidamento per il lancio</text>
    <text x="90" y="235" class="subtitle">Ambito: sicurezza repository, UX esterna, prova della release, comunicazione Discord + X.</text>
    <text x="90" y="275" class="mono" font-size="17" fill="#7186a6">PERIODO 2026-08-24 → 2026-09-20  ·  POLICY: FREEZE / NESSUNA NUOVA FUNZIONE</text>

    <g transform="translate(1380 82)">
      <rect width="330" height="178" rx="24" fill="url(#deadline)" filter="url(#shadow)"/>
      <text x="26" y="37" class="mono" font-size="15" font-weight="800" letter-spacing="2" fill="#cffafe">SCADENZA</text>
      <text x="24" y="119" font-size="69" font-weight="830" letter-spacing="-3" fill="#ffffff">18 SET</text>
      <text x="25" y="153" class="mono" font-size="18" font-weight="700" fill="#e0e7ff">2026 · VEN · CEST</text>
    </g>
  </g>

  <!-- Risk register: issue plus the smallest public-facing response. -->
  <g class="sans" transform="translate(90 370)">
    <text y="0" class="eyebrow">01 / REGISTRO RISCHI</text>
    <text y="48" class="section-title">La qualità attuale è alta; i rischi sono conservarla e renderla leggibile.</text>
    <text y="82" class="section-note">La priorità riguarda il lancio, non il codice. Le azioni restano nel perimetro di consolidamento.</text>

    <g transform="translate(0 116)">
      <rect width="790" height="188" rx="20" fill="#101e34" stroke="#29405f"/>
      <text x="24" y="31" class="mono risk-id">R-01 / COMPRENSIBILITÀ</text>
      <rect x="674" y="16" width="88" height="28" rx="14" fill="#7f1d1d"/>
      <text x="718" y="36" class="mono priority">ALTA</text>
      <text x="24" y="67" class="risk-title">La densità documentale nasconde il cuore del progetto</text>
      <text x="24" y="99" class="risk-body">Un nuovo visitatore vede il rigore, ma non capisce in 30 secondi</text>
      <text x="24" y="125" class="risk-body">perché dovrebbe provare Graph Horizon.</text>
      <text x="24" y="161" class="mono risk-action"><tspan class="done">AZIONE  Sintetizza il valore</tspan><tspan> + aggiungi una prova immediata.</tspan></text>
    </g>
    <g transform="translate(830 116)">
      <rect width="790" height="188" rx="20" fill="#101e34" stroke="#29405f"/>
      <text x="24" y="31" class="mono risk-id">R-02 / GARANZIE REPOSITORY</text>
      <rect x="674" y="16" width="88" height="28" rx="14" fill="#7f1d1d"/>
      <text x="718" y="36" class="mono priority">ALTA</text>
      <text x="24" y="67" class="risk-title">Il rigore interno non ha una traduzione pubblica completa</text>
      <text x="24" y="99" class="risk-body done">Segnali mancanti: CI visibile e main protetto.</text>
      <text x="24" y="125" class="risk-body done">Completati: security scanning + SECURITY.md.</text>
      <text x="24" y="161" class="mono risk-action done">AZIONE  Esponi controlli di repository verificabili.</text>
    </g>
    <g transform="translate(0 324)">
      <rect width="790" height="188" rx="20" fill="#101e34" stroke="#29405f"/>
      <text x="24" y="31" class="mono risk-id">R-03 / MANUTENIBILITÀ</text>
      <rect x="674" y="16" width="88" height="28" rx="14" fill="#78350f"/>
      <text x="718" y="36" class="mono priority" fill="#fef3c7">ALTA</text>
      <text x="24" y="67" class="risk-title">CPU / Vulkan / Metal / hybrid è una matrice onerosa</text>
      <text x="24" y="99" class="risk-body">Per un solo manutentore il rischio non è la qualità attuale;</text>
      <text x="24" y="125" class="risk-body">è riuscire a conservarla nel tempo.</text>
      <text x="24" y="161" class="mono risk-action">AZIONE  Mantieni i gate dei backend espliciti e riproducibili.</text>
    </g>
    <g transform="translate(830 324)">
      <rect width="790" height="188" rx="20" fill="#101e34" stroke="#29405f"/>
      <text x="24" y="31" class="mono risk-id">R-04 / PERIMETRO PRODOTTO</text>
      <rect x="674" y="16" width="88" height="28" rx="14" fill="#164e63"/>
      <text x="718" y="36" class="mono priority" fill="#cffafe">MEDIA</text>
      <text x="24" y="67" class="risk-title">Il supporto Ministral 3 Q4_K_M è volutamente stretto</text>
      <text x="24" y="99" class="risk-body">È un punto di forza su Discord Mistral e un vincolo di nicchia</text>
      <text x="24" y="125" class="risk-body">per il pubblico generale. Entrambi i fatti vanno esplicitati.</text>
      <text x="24" y="161" class="mono risk-action done">AZIONE  Pubblica il perimetro di supporto esatto.</text>
    </g>
    <g transform="translate(0 532)">
      <rect width="790" height="188" rx="20" fill="#101e34" stroke="#29405f"/>
      <text x="24" y="31" class="mono risk-id">R-05 / UX CONTRIBUTIVA</text>
      <rect x="674" y="16" width="88" height="28" rx="14" fill="#164e63"/>
      <text x="718" y="36" class="mono priority" fill="#cffafe">MEDIA</text>
      <text x="24" y="67" class="risk-title">Regole contributive rigide possono frenare piccole modifiche</text>
      <text x="24" y="99" class="risk-body">Mantieni il rigore. Rendi bug report e piccole proposte</text>
      <text x="24" y="125" class="risk-body">ovvi, brevi e a basso attrito.</text>
      <text x="24" y="161" class="mono risk-action">AZIONE  Crea un percorso minimo; conserva gli invarianti.</text>
    </g>
    <g transform="translate(830 532)">
      <rect width="790" height="188" rx="20" fill="#101e34" stroke="#29405f"/>
      <text x="24" y="31" class="mono risk-id">R-06 / PROVA COMPARATIVA</text>
      <rect x="674" y="16" width="88" height="28" rx="14" fill="#7f1d1d"/>
      <text x="718" y="36" class="mono priority">ALTA</text>
      <text x="24" y="67" class="risk-title">Nessuna dimostrazione o comparazione immediata</text>
      <text x="24" y="99" class="risk-body">Mancano screenshot, GIF e una risposta breve a:</text>
      <text x="24" y="125" class="risk-body">«Perché Graph Horizon invece di llama.cpp?»</text>
      <text x="24" y="161" class="mono risk-action">AZIONE  Fornisci prova visiva + confronto circoscritto.</text>
    </g>
  </g>

  <!-- Execution matrix: fixed columns expose deliverables and exit criteria. -->
  <g class="sans" transform="translate(90 1215)">
    <text y="0" class="eyebrow">02 / MATRICE OPERATIVA</text>
    <text y="48" class="section-title">Deliverable e gate d’uscita</text>
    <text y="82" class="section-note">Barrato = completato nel branch o nel repository al 26 agosto. Il gate resta aperto finché ogni requisito è verificato.</text>

    <g transform="translate(0 112)">
      <rect width="1620" height="832" rx="24" fill="#0c192c" stroke="#29405f"/>
      <rect width="1620" height="62" rx="24" fill="#13233b"/>
      <path d="M0 38 Q0 62 24 62 H1596 Q1620 62 1620 38 V62 H0Z" fill="#13233b"/>
      <line x1="260" y1="0" x2="260" y2="832" stroke="#29405f"/>
      <line x1="1110" y1="0" x2="1110" y2="832" stroke="#29405f"/>
      <text x="28" y="39" class="mono table-head">PERIODO / MODALITÀ</text>
      <text x="290" y="39" class="mono table-head">OUTPUT TECNICO</text>
      <text x="1140" y="39" class="mono table-head">GATE D’USCITA</text>

      <g transform="translate(0 62)">
        <text x="28" y="42" class="date">24–30 AGO</text>
        <text x="28" y="70" class="mono date-sub">FONDAMENTA</text>
        <text x="28" y="105" class="mono" font-size="15" fill="#7186a6">NESSUNA FEATURE</text>
        <text x="290" y="36" class="task done">• secret scanning + push protection + Dependabot</text>
        <text x="290" y="68" class="task done">• CI CPU + frontend; proteggi main</text>
        <text x="290" y="100" class="task"><tspan class="done">• SECURITY.md</tspan><tspan class="done"> + completa i metadati Cargo</tspan></text>
        <text x="1140" y="34" class="mono gate-label">GATE A / GARANZIE REPOSITORY</text>
        <text x="1140" y="67" class="gate done">I controlli sono pubblici e applicabili.</text>
        <text x="1140" y="96" class="gate done">La CI CPU + frontend è verde.</text>
      </g>
      <line x1="0" y1="202" x2="1620" y2="202" stroke="#29405f"/>
      <g transform="translate(0 202)">
        <text x="28" y="42" class="date">31 AGO–6 SET</text>
        <text x="28" y="70" class="mono date-sub">UX ESTERNA</text>
        <text x="290" y="34" class="task done">• installa ed esegui da un clone pulito</text>
        <text x="290" y="66" class="task done">• verifica CPU e ogni backend disponibile localmente</text>
        <text x="290" y="98" class="task done">• rileggi il README da nuovo utente; correggi comandi ambigui</text>
        <text x="290" y="130" class="task">• acquisisci screenshot/GIF di CLI + Web UI</text>
        <text x="290" y="162" class="task done">• seleziona benchmark; dichiara hardware + limiti</text>
        <text x="1140" y="34" class="mono gate-label">GATE B / ZERO ASSISTENZA</text>
        <text x="1140" y="67" class="gate">Un utente esterno può capire,</text>
        <text x="1140" y="96" class="gate">installare e provare Graph Horizon</text>
        <text x="1140" y="125" class="gate">senza assistenza del manutentore.</text>
      </g>
      <line x1="0" y1="382" x2="1620" y2="382" stroke="#29405f"/>
      <g transform="translate(0 382)">
        <text x="28" y="42" class="date">7–11 SET</text>
        <text x="28" y="70" class="mono date-sub">RELEASE RC</text>
        <text x="28" y="105" class="mono" font-size="15" fill="#c4b5fd">FREEZE FUNZIONALE</text>
        <text x="290" y="34" class="task">• riesegui ogni gate in freeze funzionale</text>
        <text x="290" y="66" class="task">• verifica download anonimo, checksum e installazione finale</text>
        <text x="290" y="98" class="task">• solo docs / config GitHub → mantieni v0.1.2</text>
        <text x="290" y="130" class="task">• fix runtime o installer → pubblica v0.1.3</text>
        <text x="1140" y="34" class="mono gate-label">GATE C / PROVA RELEASE</text>
        <text x="1140" y="67" class="gate">L’artefatto finale è scaricabile anonimamente,</text>
        <text x="1140" y="96" class="gate">ha checksum, è installabile e</text>
        <text x="1140" y="125" class="gate">la decisione di versione è registrata.</text>
      </g>
      <line x1="0" y1="532" x2="1620" y2="532" stroke="#29405f"/>
      <g transform="translate(0 532)">
        <text x="28" y="42" class="date">12–15 SET</text>
        <text x="28" y="70" class="mono date-sub">COMUNICAZIONE RC</text>
        <text x="290" y="30" class="task done">• definisci Graph Horizon in una frase</text>
        <text x="290" y="58" class="task">• prepara copy per canale: Discord completo / X conciso</text>
        <text x="290" y="86" class="task">• aggiungi 1–2 risultati, limiti, media e link tracciati</text>
        <text x="290" y="114" class="task">• dichiara valore Ministral 3, modelli + backend supportati</text>
        <text x="290" y="142" class="task">• prepara risposte: prestazioni / modelli / hardware / llama.cpp</text>
        <text x="1140" y="30" class="mono gate-label">GATE D / CANALI PRONTI</text>
        <text x="1140" y="58" class="gate">I copy Discord + X sono pronti.</text>
        <text x="1140" y="86" class="gate">Claim coerenti; limiti espliciti;</text>
        <text x="1140" y="114" class="gate">media validi; link tracciati funzionanti.</text>
      </g>
      <line x1="0" y1="692" x2="1620" y2="692" stroke="#29405f"/>
      <g transform="translate(0 692)">
        <text x="28" y="42" class="date">16–17 SET</text>
        <text x="28" y="70" class="mono date-sub">SOAK FINALE</text>
        <text x="28" y="105" class="mono" font-size="15" fill="#c4b5fd">SOLO BLOCCANTI</text>
        <text x="290" y="34" class="task">• congela codice, note di release, post Discord e thread X</text>
        <text x="290" y="66" class="task">• riesegui smoke CI + installazione anonima + checksum</text>
        <text x="290" y="98" class="task">• ricontrolla ogni claim; valida i link tracciati finali</text>
        <text x="1140" y="34" class="mono gate-label">GATE E / GO–NO-GO</text>
        <text x="1140" y="67" class="gate">CI verde; installazione funzionante;</text>
        <text x="1140" y="96" class="gate">nessun problema sicurezza; tutti i claim verificati.</text>
      </g>
    </g>
  </g>

  <!-- Final operational gate: timing, response window, and hard deferral conditions. -->
  <g class="sans" transform="translate(90 2210)">
    <rect width="1620" height="220" rx="28" fill="url(#deadline)" filter="url(#shadow)"/>
    <text x="34" y="43" class="mono" font-size="15" font-weight="800" letter-spacing="2" fill="#cffafe">GATE PUBBLICAZIONE / 2026-09-18</text>
    <text x="30" y="145" font-size="118" font-weight="840" letter-spacing="-6" fill="#ffffff">18</text>
    <text x="205" y="105" font-size="40" font-weight="780" fill="#ffffff">SETTEMBRE</text>
    <text x="207" y="137" class="mono" font-size="18" font-weight="700" fill="#e0e7ff">17:00 CEST · DISCORD</text>
    <text x="207" y="169" class="mono" font-size="18" font-weight="700" fill="#e0e7ff">17:30 CEST · X</text>
    <line x1="560" y1="28" x2="560" y2="192" stroke="#ffffff" stroke-opacity="0.38"/>
    <text x="600" y="52" class="mono" font-size="16" font-weight="800" letter-spacing="1.5" fill="#dbeafe">GATE F / PUBBLICAZIONE MULTICANALE</text>
    <text x="600" y="84" font-size="18" font-weight="560" fill="#ffffff">Prima Discord; poi X con prova visiva e link tracciato alla release.</text>
    <text x="600" y="124" class="mono" font-size="16" font-weight="800" letter-spacing="1.2" fill="#dbeafe">MONITORAGGIO WEEKEND / 19–20 SET</text>
    <text x="600" y="154" font-size="18" font-weight="560" fill="#ffffff">Monitora Discord, GitHub e menzioni X; apri issue riproducibili.</text>
    <text x="600" y="188" class="mono" font-size="14" font-weight="700" fill="#fecaca">RINVIA: install rotta · CI rossa · sicurezza · claim non verificato — mai per estetica</text>
  </g>

  <text x="1710" y="2475" text-anchor="end" class="mono" font-size="14" fill="#607593">GRAPH HORIZON / CONSOLIDAMENTO LANCIO / STATO 2026-08-26</text>
</svg>
